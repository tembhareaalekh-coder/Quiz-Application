kind = "web"
previewPath = "/"
title = "Online Quiz"
description = "A responsive quiz app with category selection, timed multiple-choice questions, progress tracking, scoring, and restartable results."
version = "1.0.0"
id = "artifacts/online-quiz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24014

[services.development]
run = "pnpm --filter @workspace/online-quiz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/online-quiz", "run", "build" ]
serve = "static"
publicDir = "artifacts/online-quiz/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24014"
BASE_PATH = "/"
